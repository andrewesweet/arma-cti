[project]
name = "cti-daemon"
version = "0.1.0"
description = "arma-cti Python daemon: AI Commander planner and snapshot persistence (ADR-0004)."
requires-python = ">=3.13,<3.14"
dependencies = ["networkx>=3.5"]

[project.scripts]
cti-daemon = "cti_daemon.transport:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "hypothesis>=6.163",
  "coverage>=7.15",
  "mutmut>=3.6",
  "ruff>=0.16",
  "ty==0.0.65", # pre-1.0 and moving fast: pin exactly, bump deliberately
  "pytest-xdist>=3.8",
]

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python code blocks inside Markdown. Documents under docs/ quote
# third-party source verbatim, and reformatting a quotation falsifies it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
# `×` (U+00D7) is the character the process docs spell `validated ×N` with, so
# the gate over those markers has to spell it too, in patterns and in the
# findings it prints (#186). Confusable with `x` by design — that is why the
# docs chose it — and RUF001-3 would otherwise fire thirty times in one file.
allowed-confusables = ["×"]
ignore = [
  "COM812", # trailing-comma rule fights the formatter
  "CPY001", # personal project, no copyright-header convention
  "D203",   # mutually exclusive with D211
  "D213",   # mutually exclusive with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # asserts are the point of a test
  "PLR2004", # magic values are fine in expectations
  "D103",    # the test name is the docstring
  "INP001",  # pytest rootdir layout deliberately has no __init__.py
]
# Standalone build tools, run as scripts rather than imported.
"tools/*.py" = ["INP001"]
# Claude Code hooks: single-purpose scripts on a stdin/stderr/exit-code contract.
".claude/hooks/*.py" = [
  "T201",     # stdout/stderr text IS the hook's output channel
  "S603",     # the formatter argv is built from a fixed allow-list
  "S607",     # formatters are resolved off PATH on purpose
  "PLW1510",  # a formatter's exit code is deliberately ignored
  "S110",     # a failing formatter must never block the edit
  "BLE001",   # ditto: any formatter exception is swallowed by design
  "INP001",   # deliberately not a package: hooks run as scripts, and their one
              # shared module (shell_reading) resolves off the script directory
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` is one worker per logical CPU (#197, from #195's measurement). The
# tier's wall clock is six times its user CPU — it waits on `flock`, on bash
# subprocesses and on stub bring-ups rather than computing — so the workers
# oversubscribe nothing, and every test is function-scoped over its own
# `tmp_path` with no shared fixture between them. Serial for a debugging session
# is `-n0` on the command line, which overrides this; a `mutmut` sweep, which
# runs the suite once per mutant, wants `PYTEST_ADDOPTS=-n0` for the same reason.
addopts = "-q --strict-markers --strict-config -n auto"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/cti_daemon"]

[tool.ty.src]
include = ["src", "tests"]
