[project]
name = "cti-daemon"
version = "0.1.0"
description = "arma-cti Python daemon: AI Commander planner and snapshot persistence (ADR-0004)."
requires-python = ">=3.13,<3.14"
dependencies = ["networkx>=3.5"]

[project.scripts]
cti-daemon = "cti_daemon.transport:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  # Machine B provisioning is a repository-owned interface. Pin both halves so
  # an unattended commissioning run does not change underneath the runbook.
  "ansible-core==2.21.2",
  "ansible-lint==26.6.0",
  "pytest>=9.1",
  "hypothesis>=6.163",
  # `just mutation` runs the tests under coverage with `dynamic_context =
  # test_function` to choose a subject, so this is a gate dependency now and not
  # only a reporting one (#239, ADR-0064).
  "coverage>=7.15",
  "ruff>=0.16",
  "ty==0.0.65", # pre-1.0 and moving fast: pin exactly, bump deliberately
  "pytest-xdist>=3.8",
  "scriv==1.8.0",
]

[tool.uv.build-backend]
module-root = "src"

[tool.scriv]
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
changelog = "CHANGELOG.md"
format = "md"
md_header_level = 2
md_html_anchors = false
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python code blocks inside Markdown. Documents under docs/ quote
# third-party source verbatim, and reformatting a quotation falsifies it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
# `×` (U+00D7) is the character the process docs spell `validated ×N` with, so
# the gate over those markers has to spell it too, in patterns and in the
# findings it prints (#186). Confusable with `x` by design — that is why the
# docs chose it — and RUF001-3 would otherwise fire thirty times in one file.
allowed-confusables = ["×"]
ignore = [
  "COM812", # trailing-comma rule fights the formatter
  "CPY001", # personal project, no copyright-header convention
  "D203",   # mutually exclusive with D211
  "D213",   # mutually exclusive with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # asserts are the point of a test
  "PLR2004", # magic values are fine in expectations
  "D103",    # the test name is the docstring
  "INP001",  # pytest rootdir layout deliberately has no __init__.py
]
# Standalone build tools, run as scripts rather than imported.
"tools/*.py" = ["INP001"]
# This file is a command coordinator: it prints its machine contract and keeps
# validation ladders together so their typed failures cannot drift by helper.
"tools/machine_b.py" = ["C901", "FBT001", "PLR0911", "PLR0912", "PLR0915", "T201"]
# This evaluator has two deliberately explicit ladders: structured refusal text must retain
# field names, and the live adapter's argv is validated before its subprocess seam.
"tools/guidance_eval.py" = [
  "C901",    # scoring and pair validation keep their ordered fail-closed ladders together
  "EM101",   # refusal strings carry machine-readable field and case identities
  "EM102",   # refusal strings carry machine-readable field and case identities
  "FBT003",  # fixture safety booleans are clearer at their call site
  "PLR0912", # pair validation checks each provenance, cell, and contract boundary
  "PLR0915", # pair validation emits one complete interpreted result
  "S603",    # live argv is a validated configuration input, never shell-expanded
  "T201",    # this standalone command's stdout/stderr is its public result channel
  "TRY003",  # typed refusal text is the evaluator's machine-readable interface
]
# The installed client supervisor keeps its launch/observe/teardown ladder in
# one function so every exit reaches the same owned-cgroup cleanup.
"ops/machine-b/files/cti_arma_client.py" = ["C901", "PLR0912", "PLR0915"]
# Claude Code hooks: single-purpose scripts on a stdin/stderr/exit-code contract.
".claude/hooks/*.py" = [
  "EXE001",   # commit-msg invokes its guard through python3; Git mode is intentionally non-executable
  "T201",     # stdout/stderr text IS the hook's output channel
  "S603",     # the formatter argv is built from a fixed allow-list
  "S607",     # formatters are resolved off PATH on purpose
  "PLW1510",  # a formatter's exit code is deliberately ignored
  "S110",     # a failing formatter must never block the edit
  "BLE001",   # ditto: any formatter exception is swallowed by design
  "INP001",   # deliberately not a package: hooks run as scripts, and their one
              # shared module (shell_reading) resolves off the script directory
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` is one worker per logical CPU (#197, from #195's measurement; the
# 6x wall-to-CPU ratio that justification once rested on measured 2.66x on
# 2026-08-20 — 593 s of serial wall against 223 s of user CPU, #442 — and an
# inherited ratio whose context had moved is how the scheduler below went
# unexamined for two weeks). `-n auto` stays because the workers
# oversubscribe nothing: the tier waits on `flock`, on bash subprocesses and on
# stub bring-ups rather than computing, and every test is function-scoped over
# its own `tmp_path` with no shared fixture between them. `--dist worksteal`
# because xdist's default `load` scheduler never rebalances — once a test
# index is assigned there is no path back, so the wall clock is set by the
# unluckiest worker's blind consecutive block, a block whose size grows with
# the test count (#442: the suite's work grew 1.23x while `load`'s wall grew
# 2.27x, with no guilty commit). Work stealing hands an idle worker part of a
# busy one's queue. The scheduler is named — not left at xdist's default — so
# its silent deletion reddens a declaration test rather than passing
# unnoticed. Serial for a debugging session is `-n0` on the command line,
# which overrides all of this (xdist forces `dist = "no"` at zero processes);
# the mutation smoke passes `-n0` for the same reason, once per mutant (#239,
# ADR-0064).
addopts = "-q --strict-markers --strict-config -n auto --dist worksteal"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/cti_daemon"]

[tool.ty.src]
include = ["src", "tests"]
