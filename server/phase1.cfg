// Phase-1 dedicated server config. Personal LAN use inside WSL2 only.
// Ports 2402-2406 (ADR-0006): 2302-2306 belong to the human's play sessions and
// this machine is shared.
hostname = "arma-cti phase 1";
password = "ctispike";
passwordAdmin = "ctispike";
maxPlayers = 8;

logFile = "server_console.log";
verifySignatures = 0;   // local unsigned addon build
battlEye = 0;           // loopback-only test tier; BattlEye has no job here
disableVoN = 1;
kickDuplicate = 0;
requiredBuild = 0;      // leave unset so a same-branch client is never gated
allowedFilePatching = 2;
persistent = 1;         // required for -autoInit

// Headless client must be whitelisted or the connection is refused.
headlessClients[] = {"127.0.0.1", "localhost"};
// Loopback only, deliberately. The phase-0 config also listed the human's LAN
// address here, and that is candidate cause 1 on the open desync (issue #8):
// localClient grants a client local-machine trust, which a client reaching the
// server over the LAN is not. Do not add a LAN address without closing #8.
localClient[] = {"127.0.0.1", "localhost"};

class Missions
{
    class Phase1
    {
        template = "cti.Stratis";
        difficulty = "veteran";
    };
};
