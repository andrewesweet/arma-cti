// Phase-0 spike server config. Personal LAN use inside WSL2 only.
hostname = "arma-cti spike";
password = "ctispike";
passwordAdmin = "ctispike";
maxPlayers = 8;

logFile = "server_console.log";
verifySignatures = 0;   // spike runs vanilla, unsigned local content
battlEye = 0;           // loopback-only test tier; BattlEye has no job here
disableVoN = 1;
kickDuplicate = 0;
requiredBuild = 0;      // research: leave unset so a same-branch client is never gated
allowedFilePatching = 2;
persistent = 1;         // required for -autoInit
motd[] = {"arma-cti phase-0 spike"};

// Headless client must be whitelisted or the connection is refused.
headlessClients[] = {"127.0.0.1", "localhost", "192.168.1.36"};
localClient[] = {"127.0.0.1", "localhost", "192.168.1.36"};

// Diagnostic, not a behaviour change: the server.cfg scripting VM sees users at
// connection level even when allPlayers is empty, so this reports exactly which
// rung a client is stuck on. getUserInfo index 6 is clientStateNumber, 7 isHeadless.
// Nested quotes in server.cfg are escaped by doubling. Keep this minimal:
// getUserInfo does NOT exist in the server.cfg scripting VM on 2.20, and an
// unknown command here fails the whole expression silently apart from an
// "Error in expression" line. The richer read lives in initServer.sqf.
onUserConnected = "diag_log (""SPIKE|user_connected "" + str _this);";
onUserDisconnected = "diag_log (""SPIKE|user_disconnected "" + str _this);";

class Missions
{
    class Spike
    {
        template = "spike.Stratis";
        difficulty = "veteran";
    };
};
