// Phase-1 server config: boots the real cti.Stratis mission rather than the
// phase-0 measurement one. Personal LAN use inside WSL2 only.
//
// `localClient[]` deliberately stays on loopback. The spike config lists the
// LAN address there, which is candidate cause 1 on the open Windows-client
// desync (#8), so the world the Campaign is actually played in does not
// inherit it.
hostname = "arma-cti phase 1";
password = "ctispike";
passwordAdmin = "ctispike";
maxPlayers = 8;

logFile = "server_console.log";
verifySignatures = 0;   // local unsigned content
battlEye = 0;           // loopback-only test tier
disableVoN = 1;
kickDuplicate = 0;
requiredBuild = 0;
allowedFilePatching = 2;
persistent = 1;         // required for -autoInit
motd[] = {"arma-cti phase 1"};

headlessClients[] = {"127.0.0.1", "localhost"};
localClient[] = {"127.0.0.1", "localhost"};

onUserConnected = "diag_log (""CTI|user_connected "" + str _this);";
onUserDisconnected = "diag_log (""CTI|user_disconnected "" + str _this);";

class Missions
{
    class Campaign
    {
        template = "cti.Stratis";
        difficulty = "veteran";
    };
};
