// Exploration scaffolding for #45 (sequential multiplexing). Not the tier's
// config: spike/phase1.cfg is, and this is a copy of it plus the two things a
// mission cycle needs.
//
// 1. serverCommandPassword — the alternate syntax of `serverCommand` runs a
//    server command from the server's own scripting VM without an admin client
//    (commands/serverCommand.wiki, syntax 2, `s2exec= server`). Without it,
//    mission rotation needs "at least one player connected"
//    (topics/Arma_3_Server_Config_File.wiki, Mission Rotation), which a
//    regression run does not have.
// 2. class Missions naming both legs, so the cycle has somewhere to go.
hostname = "arma-cti cycle spike";
password = "ctispike";
passwordAdmin = "ctispike";
serverCommandPassword = "ctispike";
maxPlayers = 8;

logFile = "server_console.log";
verifySignatures = 0;
battlEye = 0;
disableVoN = 1;
kickDuplicate = 0;
requiredBuild = 0;
allowedFilePatching = 2;
persistent = 1;
motd[] = {"arma-cti cycle spike"};

headlessClients[] = {"127.0.0.1", "localhost"};
localClient[] = {"127.0.0.1", "localhost"};

onUserConnected = "diag_log (""CTI|user_connected "" + str _this);";
onUserDisconnected = "diag_log (""CTI|user_disconnected "" + str _this);";

class Missions
{
    class LegA
    {
        template = "ctycle0.Stratis";
        difficulty = "veteran";
    };
    class LegB
    {
        template = "ctycle1.Stratis";
        difficulty = "veteran";
    };
};
